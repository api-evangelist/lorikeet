aid: lorikeet
url: https://raw.githubusercontent.com/api-evangelist/lorikeet/refs/heads/main/apis.yml
name: Lorikeet
kind: company
description: Lorikeet (Lorikeet CX) is an AI customer support agent built for complex
  and regulated businesses across chat, email, and voice. Rather than a single chatbot,
  it uses a workflow / "skills"-based orchestration layer that follows a company's
  standard operating procedures, calls into helpdesks (Zendesk, Intercom, Front) and
  internal systems through typed, no-code tools, and produces a per-step audit trail.
  Its programmatic surface centers on conversations, inbound and outbound webhooks /
  events, actions/tools, and knowledge ingestion, secured with scoped Bearer/API-key
  credentials. Full API reference is gated behind an access code, so endpoint detail
  below is modeled from Lorikeet's public integration and security materials and marked
  where unconfirmed.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- AI
- Customer Support
- AI Agent
- Support Automation
- Workflows
- Helpdesk
