    type: OpenAPI
  - url: collections/lorikeet.postman_collection.json
    type: PostmanCollection
  - url: collections/lorikeet.opencollection.json
    type: OpenCollection
  description: Ingest and manage the knowledge sources (help-center articles,
    documents, URLs) the agent draws on when following workflows. Public materials
    confirm knowledge is a first-class concept; the exact ingestion endpoints are
    access-gated and modeled here honestly rather than asserted as verified.
