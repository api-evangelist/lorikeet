    type: OpenAPI
  - url: collections/lorikeet.postman_collection.json
    type: PostmanCollection
  - url: collections/lorikeet.opencollection.json
    type: OpenCollection
  description: Programmatically create and continue conversations (support tickets)
    with the Lorikeet AI agent, post end-user and agent messages, and retrieve
    conversation state and resolution. Base URL and paths are modeled from Lorikeet's
    public materials; the authoritative reference is access-gated.
- aid: lorikeet:lorikeet-messages-api
  name: Lorikeet Messages API
  tags:
  - Messages
  - Conversations
  - Chat
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.lorikeetcx.ai/guides/quickstart
  baseURL: https://api.lorikeetcx.ai/v1
  properties:
  - url: https://docs.lorikeetcx.ai/guides/quickstart
    type: Documentation
  - url: openapi/lorikeet-openapi.yml
    type: OpenAPI
  - url: collections/lorikeet.postman_collection.json
    type: PostmanCollection
  - url: collections/lorikeet.opencollection.json
    type: OpenCollection
  description: Append and list messages within a conversation, carrying end-user
    input and the agent's replies. Messages are the unit that drives the workflow
    orchestration layer forward toward resolution or human handoff.
- aid: lorikeet:lorikeet-webhooks-events-api
  name: Lorikeet Webhooks & Events API
  tags:
  - Webhooks
  - Events
  - HMAC
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.lorikeetcx.ai/articles/ai-support-secure-api-webhook-integrations-2026
  baseURL: https://api.lorikeetcx.ai/v1
  properties:
  - url: https://www.lorikeetcx.ai/articles/ai-support-secure-api-webhook-integrations-2026
    type: Documentation
  - url: openapi/lorikeet-openapi.yml
    type: OpenAPI
  - url: collections/lorikeet.postman_collection.json
    type: PostmanCollection
  - url: collections/lorikeet.opencollection.json
    type: OpenCollection
  description: Register and manage webhook subscriptions and receive Lorikeet events
    (conversation created, updated, resolved, escalated / handoff). Lorikeet supports
    inbound HMAC-signed webhooks that are cryptographically verified before the
    agent acts, and outbound async request/response callbacks so internal APIs are
    never exposed to the open internet.
- aid: lorikeet:lorikeet-actions-tools-api
  name: Lorikeet Actions & Tools API
  tags:
  - Actions
  - Tools
  - Integrations
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.lorikeetcx.ai/articles/ai-support-secure-api-webhook-integrations-2026
  baseURL: https://api.lorikeetcx.ai/v1
  properties:
  - url: https://www.lorikeetcx.ai/articles/ai-support-secure-api-webhook-integrations-2026
    type: Documentation
  - url: openapi/lorikeet-openapi.yml
    type: OpenAPI
  - url: collections/lorikeet.postman_collection.json
    type: PostmanCollection
  - url: collections/lorikeet.opencollection.json
    type: OpenCollection
  description: Lorikeet's "tools" primitive - typed actions with defined inputs and
    outputs and optional JavaScript output transforms, built no-code in the UI - lets
    the agent call into your systems (via synchronous scoped-credential API,
    inbound webhook, or outbound async callback) and chain multiple typed actions
    across systems. This surface is configured primarily in the Lorikeet UI; any
    programmatic management is not publicly documented.
- aid: lorikeet:lorikeet-knowledge-ingestion-api
  name: Lorikeet Knowledge Ingestion API
  tags:
